<!doctype html>
<!-- Google Play developer page header (4096x2304). Render: headless Chrome at
     2048x1152, device scale 2. Play crops the top and bottom heavily on desktop
     (about the middle 60%), so everything sits in the centre band. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:2048px;height:1152px;overflow:hidden}
body{background:#f7f1e4 radial-gradient(rgba(38,35,30,.09) 2px,transparent 2.2px) 0 0/30px 30px;font-family:'Plus Jakarta Sans',sans-serif;color:#26231e;display:flex;align-items:center;justify-content:center;gap:96px}
.card{width:560px;border:4px solid #26231e;border-radius:28px;box-shadow:0 8px 0 #26231e;overflow:hidden;background:#9fd3cd}
.bar{background:#f1d27a;border-bottom:4px solid #26231e;height:56px;display:flex;align-items:center;gap:10px;padding:0 20px}
.bar i{width:18px;height:18px;border-radius:50%;border:3px solid #26231e;background:#fff}
.bar i:first-child{background:#e8957a}
.card img{display:block;width:100%;height:auto}
.pill{display:inline-flex;align-items:center;gap:12px;background:#26231e;color:#f7f1e4;border-radius:999px;padding:10px 24px;font-weight:700;font-size:28px}
.pill:before{content:"";width:12px;height:12px;border-radius:50%;background:#b4d07a}
h1{font-weight:800;font-size:124px;line-height:.98;letter-spacing:-.03em;margin:30px 0 28px}
h1 span{display:inline-block;background:#b4d07a;border:4px solid #26231e;border-radius:22px;box-shadow:0 7px 0 #26231e;padding:0 22px 12px;margin-top:10px}
.tag{display:inline-block;background:#27427a;color:#fff;border:4px solid #26231e;border-radius:16px;padding:8px 22px;font-weight:700;font-size:40px}
.hand{display:block;margin-top:30px;font-family:Caveat,cursive;font-size:44px;color:#5c584f;transform:rotate(-1.5deg)}
</style></head><body>
<div class="card"><div class="bar"><i></i><i></i><i></i></div><img src="hero-frame.webp"></div>
<div>
<div class="pill">BaskomLabs · Est. 2017</div>
<h1>Bengkel Aplikasi<br><span>Kompeni</span></h1>
<div class="tag">Wadahnya ngoprek.</div>
<span class="hand">do code for fun, no.. serious things.</span>
</div>
</body></html>
